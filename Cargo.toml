[package]
name = "glazier"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/bindings",
    "crates/codegen",
    "crates/pe",
    "crates/runtime",
    "crates/winapi",
]
resolver = "2"

[dependencies]
colored = "3.1.1"
env_logger = "0.11.8"
iced-x86 = { version = "1.21.0", default-features = true, features = ["block_encoder", "decoder", "encoder", "instr_info", "intel", "std"], optional = true }
glazier-bindings = { path = "crates/bindings" }
glazier-pe = { path = "crates/pe" }
glazier-runtime = { path = "crates/runtime" }
glazier-winapi = { path = "crates/winapi" }
log = "0.4.29"
memchr = "2.8.0"
thiserror = "2.0.17"


[features]
default = ["runtime","obfuscation","hells_gate","hardware_breakpoint"]
obfuscation = ["runtime", "glazier-winapi/obfuscation"]
runtime = ["dep:iced-x86"]
hells_gate = ["runtime", "glazier-winapi/hells_gate"]
hardware_breakpoint = ["runtime"]

[[bin]]
name = "get_remote_dlls_winapi"
path = "src/bin/get_remote_dlls_winapi.rs"
required-features = ["runtime"]

[[bin]]
name = "get_self_dlls"
path = "src/bin/get_self_dlls.rs"
required-features = ["runtime"]

[[bin]]
name = "hells_gate"
path = "src/bin/hells_gate.rs"
required-features = ["hells_gate"]

[[bin]]
name = "hells_gate_auto_binded"
path = "src/bin/hells_gate_auto_binded.rs"
required-features = ["hells_gate"]

[[bin]]
name = "hells_query_systime"
path = "src/bin/hells_query_systime.rs"
required-features = ["hells_gate"]

[[bin]]
name = "hook"
path = "src/bin/hook.rs"
required-features = ["runtime"]

[[bin]]
name = "hookpattern"
path = "src/bin/hookpattern.rs"
required-features = ["runtime"]

[[bin]]
name = "winapi_callback_hook"
path = "src/bin/winapi_callback_hook.rs"
required-features = ["runtime"]

[[bin]]
name = "hardware_breakpoint"
path = "src/bin/hardware_breakpoint.rs"
required-features = ["hardware_breakpoint"]

[[bin]]
name = "process"
path = "src/bin/process.rs"
required-features = ["runtime"]

[[bin]]
name = "read_pe_file"
path = "src/bin/read_pe_file.rs"
required-features = ["runtime"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false
incremental = false
rpath = false

[build-dependencies]
glazier-codegen = { path = "crates/codegen" }


[profile.dev]
incremental = true
codegen-units = 16
